name: Compiler APK Dauphin

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Préparation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libunwind-dev \
            openjdk-17-jdk

      - name: Configuration de Java 17
        run: |
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java

      - name: Installation de Buildozer et Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      - name: Lancement de la compilation Buildozer optimisée
        run: |
          # Forcer l'architecture unique arm64-v8a pour éviter le dépassement de mémoire
          export P4A_ANDROID_ARCHS=arm64-v8a
          buildozer -v android debug

      - name: Récupération de l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: dauphin-apk
          path: bin/*.apk
