name: Compiler APK Dauphin

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    container: kivy/buildozer:latest
    env:
      BUILDOZER_ALLOW_INSTALL_AS_ROOT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Configuration de Git Safe Directory
        run: |
          git config --global --add safe.directory /__w/Li-main.py/Li-main.py

      - name: Lancement de la compilation Buildozer
        run: |
          buildozer -v android debug

      - name: Récupération de l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: dauphin-apk
          path: bin/*.apk
