<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAUPHIN — Compagnon Souverain & Local-First</title>
    <style>
        /* ==========================================================================
           DAUPHIN DESIGN SYSTEM - BLEU ÉLECTRIQUE INTÉGRAL & BARRE LATÉRALE
           ========================================================================== */
        :root {
            --bg-abyss: #020617;
            --bg-panel: #060e21;
            --bg-card: #0b1736;
            --electric-blue: #0077FF;
            --electric-cyan: #00FFFF;
            --electric-glow: rgba(0, 119, 255, 0.4);
            --cyan-glow: rgba(0, 255, 255, 0.3);
            --text-main: #F8FAFC;
            --text-muted: #8EA9C4;
            --border-blue: rgba(0, 119, 255, 0.35);
            --border-cyan: rgba(0, 255, 255, 0.2);
            --danger: #FF2A5F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-abyss);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 119, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(0, 255, 255, 0.08) 0%, var(--bg-abyss) 70%);
        }

        /* ==========================================================================
           BARRE LATÉRALE SOUVERAINE & GESTION DES VOIX ONNX
           ========================================================================== */
        aside {
            width: 280px;
            background: rgba(6, 14, 33, 0.95);
            border-right: 1px solid var(--border-blue);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            z-index: 100;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-blue);
        }

        .dolphin-emblem-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--electric-glow);
        }

        .dolphin-emblem-small svg {
            width: 20px;
            height: 20px;
            fill: #FFFFFF;
        }

        .sidebar-brand h2 {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #FFFFFF, var(--electric-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-section h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .voice-sidebar-chip {
            background: var(--bg-card);
            border: 1px solid var(--border-blue);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .voice-sidebar-chip:hover {
            border-color: var(--electric-cyan);
            background: rgba(0, 119, 255, 0.15);
        }

        .voice-sidebar-chip.selected {
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            color: #020617;
            font-weight: 700;
            border-color: var(--electric-cyan);
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        .voice-sidebar-chip svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* ==========================================================================
           CONTENEUR PRINCIPAL DE DISCUSSION
           ========================================================================== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(6, 14, 33, 0.8);
            border-bottom: 1px solid var(--border-blue);
            backdrop-filter: blur(16px);
        }

        .header-status {
            font-size: 0.8rem;
            color: var(--electric-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--electric-cyan);
            box-shadow: 0 0 10px var(--electric-cyan);
            animation: pulseDot 2s infinite;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 82%;
            padding: 16px 20px;
            border-radius: 22px;
            line-height: 1.6;
            font-size: 0.98rem;
            animation: messageAppear 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            position: relative;
        }

        .message.dauphin {
            align-self: flex-start;
            background: linear-gradient(145deg, var(--bg-card), var(--bg-panel));
            border: 1px solid var(--border-blue);
            border-bottom-left-radius: 6px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.5);
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--electric-blue), #0044BB);
            color: #FFFFFF;
            border-bottom-right-radius: 6px;
            box-shadow: 0 6px 20px rgba(0, 119, 255, 0.35);
        }

        .message-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 6px;
        }

        .message.user .message-meta {
            color: rgba(255, 255, 255, 0.8);
            border-top-color: rgba(255, 255, 255, 0.15);
        }

        /* ==========================================================================
           ZONE DE SAISIE & BOUTONS AVEC LOGO DAUPHIN INTÉGRÉ
           ========================================================================== */
        footer {
            padding: 16px 24px 26px;
            background: linear-gradient(to top, var(--bg-abyss) 65%, rgba(2, 6, 23, 0.85) 90%, transparent);
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-panel);
            border: 1px solid var(--electric-blue);
            border-radius: 36px;
            padding: 8px 14px 8px 22px;
            box-shadow: 0 0 30px rgba(0, 119, 255, 0.2);
        }

        .input-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.02rem;
            outline: none;
        }

        .input-container input::placeholder {
            color: var(--text-muted);
        }

        .btn-dolphin-action {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            color: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 0 18px var(--electric-glow);
        }

        .btn-dolphin-action:hover {
            transform: scale(1.08);
            box-shadow: 0 0 28px var(--electric-cyan);
        }

        .btn-dolphin-action svg {
            width: 22px;
            height: 22px;
            fill: #020617;
        }

        .btn-dolphin-action.recording {
            background: linear-gradient(135deg, var(--danger), #FF7A00);
            animation: pulseMic 1.2s infinite;
        }

        /* ==========================================================================
           ANIMATIONS
           ========================================================================== */
        @keyframes pulseDot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseMic {
            0% { transform: scale(1); box-shadow: 0 0 10px var(--danger); }
            50% { transform: scale(1.12); box-shadow: 0 0 25px var(--danger); }
            100% { transform: scale(1); box-shadow: 0 0 10px var(--danger); }
        }

        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .audio-wave-bars {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            height: 14px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .audio-wave-bars span {
            width: 3px;
            height: 100%;
            background-color: var(--electric-cyan);
            border-radius: 2px;
            animation: waveBounce 0.8s infinite ease-in-out alternate;
        }

        .audio-wave-bars span:nth-child(2) { animation-delay: 0.2s; }
        .audio-wave-bars span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes waveBounce {
            from { height: 4px; }
            to { height: 14px; }
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
       BARRE LATÉRALE DE CONTRÔLE SOUVERAIN
       ========================================================================== -->
    <aside>
        <div class="sidebar-brand">
            <div class="dolphin-emblem-small">
                <svg viewBox="0 0 24 24">
                    <path d="M21.5,11.5c-1.4-2.5-4.3-4.2-7.6-4.4c-0.6-1.4-1.8-2.6-3.4-3.1c0.3,1.1,0.2,2.2-0.2,3.1C7.3,7.7,4.9,9.6,3.5,12.2 c-0.8,1.5-1.2,3.2-1.1,4.8c1.1-0.9,2.4-1.5,3.8-1.7c1.6,1.2,3.8,1.7,6,1.3c0.9,1.2,2.2,2.1,3.7,2.4c-0.4-1.1-0.4-2.2,0-3.2 c2.4-0.9,4.4-2.5,5.6-4.3C21.7,11.5,21.6,11.5,21.5,11.5z M15.5,11c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1S16.1,11,15.5,11z"/>
                </svg>
            </div>
            <h2>DAUPHIN</h2>
        </div>

        <div class="sidebar-section">
            <h3>Moteur ONNX / Voix</h3>
            <div class="voice-sidebar-chip selected" data-voice="dauphin_prime" data-freq="95">
                <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4Z"/></svg>
                Dauphin Prime
            </div>
            <div class="voice-sidebar-chip" data-voice="sovereign_soft" data-freq="140">
                <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4Z"/></svg>
                Sovereign Soft
            </div>
            <div class="voice-sidebar-chip" data-voice="abyss_warm" data-freq="80">
                <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4Z"/></svg>
                Abyss Warm
            </div>
        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
            <button class="voice-sidebar-chip" id="btnClearMemory" style="justify-content: center; background: rgba(255, 42, 95, 0.1); border-color: rgba(255, 42, 95, 0.3);">
                🗑️ Purger la mémoire
            </button>
        </div>
    </aside>

    <!-- ==========================================================================
       ZONE PRINCIPALE DE CONVERSATION
       ========================================================================== -->
    <div class="chat-area">
        <header>
            <div class="header-status">
                <div class="status-dot"></div>
                Prêt pour compilation native ONNX (Zéro Serveur)
            </div>
        </header>

        <main id="chatContainer"></main>

        <footer>
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Échange avec Dauphin en toute souveraineté..." autocomplete="off">
                <button class="btn-dolphin-action" id="btnMic" title="Activer le micro local">
                    🎙️
                </button>
                <button class="btn-dolphin-action" id="btnSend" title="Envoyer le message">
                    <!-- Logo Dauphin intégré dans le bouton d'envoi -->
                    <svg viewBox="0 0 24 24">
                        <path d="M21.5,11.5c-1.4-2.5-4.3-4.2-7.6-4.4c-0.6-1.4-1.8-2.6-3.4-3.1c0.3,1.1,0.2,2.2-0.2,3.1C7.3,7.7,4.9,9.6,3.5,12.2 c-0.8,1.5-1.2,3.2-1.1,4.8c1.1-0.9,2.4-1.5,3.8-1.7c1.6,1.2,3.8,1.7,6,1.3c0.9,1.2,2.2,2.1,3.7,2.4c-0.4-1.1-0.4-2.2,0-3.2 c2.4-0.9,4.4-2.5,5.6-4.3C21.7,11.5,21.6,11.5,21.5,11.5z M15.5,11c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1S16.1,11,15.5,11z"/>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- ==========================================================================
       LOGIQUE JAVASCRIPT LOCALE SOUVERAINE
       ========================================================================== -->
    <script>
        const DauphinApp = {
            memoryKey: 'dauphin_vault_sidebar_v1',
            selectedFreq: 95,
            audioCtx: null,

            init() {
                this.cacheDOM();
                this.bindEvents();
                this.loadMemory();
                this.initAudioContext();
            },

            cacheDOM() {
                this.chatContainer = document.getElementById('chatContainer');
                this.userInput = document.getElementById('userInput');
                this.btnSend = document.getElementById('btnSend');
                this.btnMic = document.getElementById('btnMic');
                this.btnClearMemory = document.getElementById('btnClearMemory');
                this.voiceChips = document.querySelectorAll('.voice-sidebar-chip[data-voice]');
            },

            bindEvents() {
                this.btnSend.addEventListener('click', () => this.handleUserMessage());
                this.userInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleUserMessage();
                });

                this.btnClearMemory.addEventListener('click', () => {
                    if (confirm("Voulez-vous effacer la mémoire locale ?")) {
                        localStorage.removeItem(this.memoryKey);
                        this.chatContainer.innerHTML = '';
                        this.greet();
                    }
                });

                this.btnMic.addEventListener('click', () => this.triggerLocalMicrophone());

                this.voiceChips.forEach(chip => {
                    chip.addEventListener('click', () => {
                        this.voiceChips.forEach(c => c.classList.remove('selected'));
                        chip.classList.add('selected');
                        this.selectedFreq = parseFloat(chip.dataset.freq);
                        this.playTone(this.selectedFreq);
                    });
                });
            },

            initAudioContext() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.audioCtx = new AudioContext();
            },

            playTone(freq) {
                if (!this.audioCtx) return;
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                try {
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.6);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start();
                    osc.stop(this.audioCtx.currentTime + 0.6);
                } catch(e) {}
            },

            loadMemory() {
                const saved = localStorage.getItem(this.memoryKey);
                if (saved) {
                    JSON.parse(saved).forEach(msg => this.renderMessage(msg.sender, msg.text, false));
                } else {
                    this.greet();
                }
            },

            saveMessage(sender, text) {
                const saved = localStorage.getItem(this.memoryKey);
                const messages = saved ? JSON.parse(saved) : [];
                messages.push({ sender, text });
                localStorage.setItem(this.memoryKey, JSON.stringify(messages));
            },

            greet() {
                const text = "Je suis Dauphin. L'interface latérale et les structures d'accueil sont en place. Prêt pour l'embarquement natif ONNX.";
                this.renderMessage('dauphin', text, true);
            },

            renderMessage(sender, text, shouldSave = true) {
                const div = document.createElement('div');
                div.className = `message ${sender}`;
                const wave = sender === 'dauphin' ? '<div class="audio-wave-bars"><span></span><span></span><span></span></div>' : '';
                div.innerHTML = `
                    <div>${text} ${wave}</div>
                    <div class="message-meta">
                        <span>${sender === 'dauphin' ? 'Dauphin • Souverain' : 'Toi'}</span>
                        <span>${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                `;
                this.chatContainer.appendChild(div);
                this.chatContainer.scrollTop = this.chatContainer.scrollHeight;
                if (shouldSave) this.saveMessage(sender, text);
            },

            triggerLocalMicrophone() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Reconnaissance vocale non disponible dans cet environnement de test.");
                    return;
                }
                const recognition = new SpeechRecognition();
                recognition.lang = 'fr-FR';
                this.btnMic.classList.add('recording');
                recognition.start();
                recognition.onresult = (e) => {
                    this.userInput.value = e.results[0][0].transcript;
                    this.btnMic.classList.remove('recording');
                    this.handleUserMessage();
                };
                recognition.onerror = () => this.btnMic.classList.remove('recording');
                recognition.onend = () => this.btnMic.classList.remove('recording');
            },

            handleUserMessage() {
                const text = this.userInput.value.trim();
                if (!text) return;
                this.userInput.value = '';
                this.renderMessage('user', text);

                setTimeout(() => {
                    let reply = `J'ai enregistré ton propos : "${text}". Une fois compilé en application native avec ONNX, ce module local traitera l'analyse sémantique complète sans aucune latence ni filtre distant.`;
                    if (text.toLowerCase().includes('bonjour')) {
                        reply = "Bonjour. Notre sanctuaire local est prêt. Qu'est-ce qu'on structure ensemble ?";
                    }
                    this.renderMessage('dauphin', reply);
                    this.playTone(this.selectedFreq);
                }, 400);
            }
        };

        document.addEventListener('DOMContentLoaded', () => DauphinApp.init());
    </script>
</body>
</html>
