<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAUPHIN — Compagnon Souverain & Local-First</title>
    <link rel="manifest" href="./manifest.json">
 <style>
        :root {
            --bg-abyss: #020617;
            --bg-panel: #060e21;
            --bg-card: #0b1736;
            --electric-blue: #0077FF;
            --electric-cyan: #00FFFF;
            --electric-glow: rgba(0, 119, 255, 0.4);
            --text-main: #F8FAFC;
            --text-muted: #8EA9C4;
            --border-blue: rgba(0, 119, 255, 0.35);
            --danger: #FF2A5F;
            --success: #00FF88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-abyss);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 119, 255, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(0, 255, 255, 0.08) 0%, var(--bg-abyss) 70%);
        }

        /* Écran d'ouverture */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: var(--bg-abyss);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splashScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-emblem {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px var(--electric-glow);
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease;
        }

        .splash-emblem:hover {
            transform: scale(1.08);
        }

        .splash-emblem svg {
            width: 65px;
            height: 65px;
            fill: #FFFFFF;
        }

        .splash-text {
            text-align: center;
        }

        .splash-text h2 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #FFFFFF, var(--electric-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .splash-text p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* En-tête */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(6, 14, 33, 0.9);
            border-bottom: 1px solid var(--border-blue);
            backdrop-filter: blur(16px);
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dolphin-emblem {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--electric-glow);
        }

        .dolphin-emblem svg {
            width: 22px;
            height: 22px;
            fill: #FFFFFF;
        }

        .brand-text h1 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #FFFFFF, var(--electric-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text span {
            font-size: 0.72rem;
            color: var(--electric-cyan);
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--electric-cyan);
            box-shadow: 0 0 10px var(--electric-cyan);
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-mode-toggle {
            background: rgba(0, 119, 255, 0.15);
            border: 1px solid var(--electric-blue);
            color: var(--electric-cyan);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-mode-toggle.online {
            background: rgba(0, 255, 136, 0.15);
            border-color: var(--success);
            color: var(--success);
        }

        .btn-top {
            background: rgba(0, 119, 255, 0.1);
            border: 1px solid var(--border-blue);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-top:hover {
            background: var(--electric-blue);
            color: #020617;
        }

        /* Zone de chat */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.dauphin {
            align-self: flex-start;
            background: var(--bg-card);
            border: 1px solid var(--border-blue);
            border-bottom-left-radius: 4px;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--electric-blue), #0044BB);
            color: #FFFFFF;
            border-bottom-right-radius: 4px;
        }

        .message-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
        }

        /* Pied de page et saisie */
        footer {
            padding: 16px 20px 24px;
            background: rgba(2, 6, 23, 0.9);
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-panel);
            border: 1px solid var(--electric-blue);
            border-radius: 30px;
            padding: 6px 10px 6px 18px;
            box-shadow: 0 0 20px rgba(0, 119, 255, 0.2);
        }

        .input-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .input-container input::placeholder {
            color: var(--text-muted);
        }

        .btn-action {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            color: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .btn-action:hover {
            transform: scale(1.05);
        }

        .btn-action.recording {
            background: var(--danger);
            animation: pulseMic 1.2s infinite;
        }

        @keyframes pulseMic {
            0% { transform: scale(1); box-shadow: 0 0 10px var(--danger); }
            50% { transform: scale(1.1); box-shadow: 0 0 20px var(--danger); }
            100% { transform: scale(1); box-shadow: 0 0 10px var(--danger); }
        }
    </style>
</head>
<body>

    <!-- Écran d'ouverture -->
    <div id="splashScreen">
        <div class="splash-emblem" id="splashEmblem" title="Caresse le Dauphin">
            <svg viewBox="0 0 24 24">
                <path d="M21.5,11.5c-1.4-2.5-4.3-4.2-7.6-4.4c-0.6-1.4-1.8-2.6-3.4-3.1c0.3,1.1,0.2,2.2-0.2,3.1C7.3,7.7,4.9,9.6,3.5,12.2 c-0.8,1.5-1.2,3.2-1.1,4.8c1.1-0.9,2.4-1.5,3.8-1.7c1.6,1.2,3.8,1.7,6,1.3c0.9,1.2,2.2,2.1,3.7,2.4c-0.4-1.1-0.4-2.2,0-3.2 c2.4-0.9,4.4-2.5,5.6-4.3C21.7,11.5,21.6,11.5,21.5,11.5z M15.5,11c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1S16.1,11,15.5,11z"/>
            </svg>
        </div>
        <div class="splash-text">
            <h2>DAUPHIN</h2>
            <p>Touche ou caresse le Dauphin pour éveiller l'application</p>
        </div>
    </div>

    <!-- En-tête -->
    <header>
        <div class="brand">
            <div class="dolphin-emblem">
                <svg viewBox="0 0 24 24">
                    <path d="M21.5,11.5c-1.4-2.5-4.3-4.2-7.6-4.4c-0.6-1.4-1.8-2.6-3.4-3.1c0.3,1.1,0.2,2.2-0.2,3.1C7.3,7.7,4.9,9.6,3.5,12.2 c-0.8,1.5-1.2,3.2-1.1,4.8c1.1-0.9,2.4-1.5,3.8-1.7c1.6,1.2,3.8,1.7,6,1.3c0.9,1.2,2.2,2.1,3.7,2.4c-0.4-1.1-0.4-2.2,0-3.2 c2.4-0.9,4.4-2.5,5.6-4.3C21.7,11.5,21.6,11.5,21.5,11.5z M15.5,11c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1S16.1,11,15.5,11z"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1>DAUPHIN</h1>
                <span><div class="status-dot" id="statusDot"></div> <span id="statusText">Mode Hors-ligne (Local)</span></span>
            </div>
        </div>
        <div class="header-controls">
            <button class="btn-mode-toggle" id="btnModeToggle" title="Basculer entre Hors-ligne et En ligne">
                🔌 <span id="modeLabel">Hors-ligne</span>
            </button>
            <button class="btn-top" id="btnClearMemory">Purger</button>
        </div>
    </header>

    <main id="chatContainer"></main>

    <footer>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Échange avec Dauphin..." autocomplete="off">
            <button class="btn-action" id="btnMic" title="Micro">🎙️</button>
            <button class="btn-action" id="btnSearch" title="Recherche">🔍</button>
            <button class="btn-action" id="btnSend" title="Envoyer">➤</button>
        </div>
    </footer>

    <script>
        const DauphinApp = {
            memoryKey: 'dauphin_vault_final',
            audioCtx: null,
            isOnline: false,

            init() {
                this.cacheDOM();
                this.bindEvents();
                this.initAudioContext();
            },

            cacheDOM() {
                this.splashScreen = document.getElementById('splashScreen');
                this.splashEmblem = document.getElementById('splashEmblem');
                this.chatContainer = document.getElementById('chatContainer');
                this.userInput = document.getElementById('userInput');
                this.btnSend = document.getElementById('btnSend');
                this.btnMic = document.getElementById('btnMic');
                this.btnSearch = document.getElementById('btnSearch');
                this.btnClearMemory = document.getElementById('btnClearMemory');
                this.btnModeToggle = document.getElementById('btnModeToggle');
                this.modeLabel = document.getElementById('modeLabel');
                this.statusText = document.getElementById('statusText');
                this.statusDot = document.getElementById('statusDot');
            },

            bindEvents() {
                this.splashEmblem.addEventListener('click', () => {
                    this.playDolphinSound();
                    this.splashScreen.classList.add('hidden');
                    this.loadMemory();
                });

                this.btnModeToggle.addEventListener('click', () => {
                    this.isOnline = !this.isOnline;
                    if (this.isOnline) {
                        this.btnModeToggle.classList.add('online');
                        this.modeLabel.textContent = "En ligne";
                        this.statusText.textContent = "Mode En ligne (Pont Web)";
                        this.statusDot.style.backgroundColor = "var(--success)";
                        this.statusDot.style.boxShadow = "0 0 10px var(--success)";
                        this.renderMessage('dauphin', "Passerelle réseau activée. Prêt pour l'interrogation mondiale.", false);
                    } else {
                        this.btnModeToggle.classList.remove('online');
                        this.modeLabel.textContent = "Hors-ligne";
                        this.statusText.textContent = "Mode Hors-ligne (Local)";
                        this.statusDot.style.backgroundColor = "var(--electric-cyan)";
                        this.statusDot.style.boxShadow = "0 0 10px var(--electric-cyan)";
                        this.renderMessage('dauphin', "Retour en circuit fermé. Sanctuaire 100% local ONNX.", false);
                    }
                });

                this.btnSend.addEventListener('click', () => this.handleUserMessage());
                this.userInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleUserMessage();
                });

                this.btnSearch.addEventListener('click', () => {
                    const text = this.userInput.value.trim();
                    if (text) this.handleSearch(text);
                });

                this.btnMic.addEventListener('click', () => this.handleMic());

                this.btnClearMemory.addEventListener('click', () => {
                    if (confirm("Effacer la mémoire ?")) {
                        localStorage.removeItem(this.memoryKey);
                        this.chatContainer.innerHTML = '';
                        this.greet();
                    }
                });
            },

            initAudioContext() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.audioCtx = new AudioContext();
            },

            playDolphinSound() {
                if (!this.audioCtx) return;
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                try {
                    const now = this.audioCtx.currentTime;
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1800, now + 0.3);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.6);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.12, now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.9);
                } catch(e) {}
            },

            loadMemory() {
                const saved = localStorage.getItem(this.memoryKey);
                if (saved) {
                    JSON.parse(saved).forEach(m => this.renderMessage(m.sender, m.text, false));
                } else {
                    this.greet();
                }
            },

            saveMessage(sender, text) {
                const saved = localStorage.getItem(this.memoryKey);
                const messages = saved ? JSON.parse(saved) : [];
                messages.push({ sender, text });
                localStorage.setItem(this.memoryKey, JSON.stringify(messages));
            },

            greet() {
                this.renderMessage('dauphin', "Je suis Dauphin. Sanctuaire souverain initialisé.", true);
                this.playDolphinSound();
            },

            renderMessage(sender, text, save = true) {
                const div = document.createElement('div');
                div.className = `message ${sender}`;
                div.innerHTML = `
                    <div>${text}</div>
                    <div class="message-meta">
                        <span>${sender === 'dauphin' ? 'Dauphin' : 'Toi'}</span>
                        <span>${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                `;
                this.chatContainer.appendChild(div);
                this.chatContainer.scrollTop = this.chatContainer.scrollHeight;
                if (save) this.saveMessage(sender, text);
            },

            async handleSearch(query) {
                this.userInput.value = '';
                this.renderMessage('user', `Recherche : ${query}`);
                
                if (!this.isOnline) {
                    this.renderMessage('dauphin', "Mode Hors-ligne actif : analyse via les poids neuronaux locaux ONNX.");
                    this.playDolphinSound();
                    return;
                }

                try {
                    const res = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
                    const data = await res.json();
                    const reply = data.extract ? data.extract : "Aucun résultat direct trouvé.";
                    this.renderMessage('dauphin', reply);
                    this.playDolphinSound();
                } catch(e) {
                    this.renderMessage('dauphin', "Erreur de la passerelle réseau.");
                }
            },

            handleMic() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Reconnaissance vocale non supportée.");
                    return;
                }
                const rec = new SpeechRecognition();
                rec.lang = 'fr-FR';
                this.btnMic.classList.add('recording');
                rec.start();
                rec.onresult = (e) => {
                    this.userInput.value = e.results[0][0].transcript;
                    this.btnMic.classList.remove('recording');
                    this.handleUserMessage();
                };
                rec.onerror = () => this.btnMic.classList.remove('recording');
                rec.onend = () => this.btnMic.classList.remove('recording');
            },

            handleUserMessage() {
                const text = this.userInput.value.trim();
                if (!text) return;
                this.userInput.value = '';
                this.renderMessage('user', text);

                setTimeout(() => {
                    let reply = `[ONNX Local] : "${text}" analysé en circuit fermé.`;
                    if (this.isOnline) {
                        reply = `[Passerelle En Ligne] : "${text}" traité avec ouverture sécurisée.`;
                    }
                    this.renderMessage('dauphin', reply);
                    this.playDolphinSound();
                }, 300);
            }
        };

        document.addEventListener('DOMContentLoaded', () => DauphinApp.init());
    </script>
</body>
</html>
