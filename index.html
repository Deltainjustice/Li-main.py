<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAUPHIN — Compagnon Souverain & Synthèse Neuronale Organique</title>
    <style>
        /* ==========================================================================
           DAUPHIN DESIGN SYSTEM - BLEU ÉLECTRIQUE INTÉGRAL (V3 SOUVERAINE)
           ========================================================================== */
        :root {
            --bg-abyss: #020617;
            --bg-panel: #060e21;
            --bg-card: #0b1736;
            --electric-blue: #0077FF;
            --electric-cyan: #00FFFF;
            --electric-glow: rgba(0, 119, 255, 0.4);
            --cyan-glow: rgba(0, 255, 255, 0.3);
            --text-main: #F8FAFC;
            --text-muted: #8EA9C4;
            --border-blue: rgba(0, 119, 255, 0.35);
            --border-cyan: rgba(0, 255, 255, 0.2);
            --danger: #FF2A5F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-abyss);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 119, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(0, 255, 255, 0.08) 0%, var(--bg-abyss) 70%);
        }

        /* ==========================================================================
           EN-TÊTE SOUVERAIN & IDENTITÉ VISUELLE
           ========================================================================== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(6, 14, 33, 0.9);
            border-bottom: 1px solid var(--border-blue);
            backdrop-filter: blur(16px);
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dolphin-emblem {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--electric-glow);
            position: relative;
        }

        .dolphin-emblem::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 1px solid var(--electric-cyan);
            animation: pulseRing 3s infinite;
        }

        .dolphin-emblem svg {
            width: 26px;
            height: 26px;
            fill: #FFFFFF;
        }

        .brand-text h1 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #FFFFFF, var(--electric-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text span {
            font-size: 0.75rem;
            color: var(--electric-cyan);
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--electric-cyan);
            box-shadow: 0 0 10px var(--electric-cyan);
            animation: pulseDot 2s infinite;
        }

        .header-controls {
            display: flex;
            gap: 12px;
        }

        /* ==========================================================================
           BOUTONS DAUPHIN & COMPOSANTS INTERACTIFS
           ========================================================================== */
        .btn-dolphin {
            background: linear-gradient(135deg, rgba(0, 119, 255, 0.15), rgba(0, 255, 255, 0.05));
            border: 1px solid var(--border-blue);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(0, 119, 255, 0.1);
        }

        .btn-dolphin:hover {
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            border-color: var(--electric-cyan);
            color: #020617;
            font-weight: 700;
            box-shadow: 0 0 25px var(--electric-glow);
            transform: translateY(-2px);
        }

        .btn-dolphin.active {
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            color: #020617;
            font-weight: 700;
            box-shadow: 0 0 20px var(--electric-glow);
            border-color: var(--electric-cyan);
        }

        /* ==========================================================================
           ESPACE DE DIALOGUE & BULLES DE CONVERSATION
           ========================================================================== */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 82%;
            padding: 16px 20px;
            border-radius: 22px;
            line-height: 1.6;
            font-size: 0.98rem;
            animation: messageAppear 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            position: relative;
        }

        .message.dauphin {
            align-self: flex-start;
            background: linear-gradient(145deg, var(--bg-card), var(--bg-panel));
            border: 1px solid var(--border-blue);
            border-bottom-left-radius: 6px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.5);
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--electric-blue), #0044BB);
            color: #FFFFFF;
            border-bottom-right-radius: 6px;
            box-shadow: 0 6px 20px rgba(0, 119, 255, 0.35);
        }

        .message-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 6px;
        }

        .message.user .message-meta {
            color: rgba(255, 255, 255, 0.8);
            border-top-color: rgba(255, 255, 255, 0.15);
        }

        /* ==========================================================================
           PANNEAU DE CONTRÔLE VOCAL & SYNTHÈSE NEURONALE ORGANIQUE
           ========================================================================== */
        footer {
            padding: 16px 24px 26px;
            background: linear-gradient(to top, var(--bg-abyss) 65%, rgba(2, 6, 23, 0.85) 90%, transparent);
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
        }

        .neural-audio-deck {
            background: var(--bg-panel);
            border: 1px solid var(--border-blue);
            border-radius: 16px;
            padding: 12px 18px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 0 15px rgba(0, 119, 255, 0.1);
        }

        .neural-audio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .neural-audio-header span b {
            color: var(--electric-cyan);
        }

        .voice-avatars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
        }

        .voice-avatar-chip {
            background: var(--bg-card);
            border: 1px solid var(--border-blue);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .voice-avatar-chip:hover {
            border-color: var(--electric-cyan);
            background: rgba(0, 119, 255, 0.15);
        }

        .voice-avatar-chip.selected {
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            color: #020617;
            font-weight: 700;
            border-color: var(--electric-cyan);
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-panel);
            border: 1px solid var(--electric-blue);
            border-radius: 36px;
            padding: 8px 14px 8px 22px;
            box-shadow: 0 0 30px rgba(0, 119, 255, 0.2);
        }

        .input-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.02rem;
            outline: none;
        }

        .input-container input::placeholder {
            color: var(--text-muted);
        }

        .btn-action-round {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            color: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 0 18px var(--electric-glow);
            font-size: 1.1rem;
        }

        .btn-action-round:hover {
            transform: scale(1.08);
            box-shadow: 0 0 28px var(--electric-cyan);
        }

        .btn-action-round.recording {
            background: linear-gradient(135deg, var(--danger), #FF7A00);
            animation: pulseMic 1.2s infinite;
        }

        /* ==========================================================================
           ANIMATIONS & EFFETS VISUELS FLUIDES
           ========================================================================== */
        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        @keyframes pulseDot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseMic {
            0% { transform: scale(1); box-shadow: 0 0 10px var(--danger); }
            50% { transform: scale(1.12); box-shadow: 0 0 25px var(--danger); }
            100% { transform: scale(1); box-shadow: 0 0 10px var(--danger); }
        }

        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .audio-wave-bars {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            height: 14px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .audio-wave-bars span {
            width: 3px;
            height: 100%;
            background-color: var(--electric-cyan);
            border-radius: 2px;
            animation: waveBounce 0.8s infinite ease-in-out alternate;
        }

        .audio-wave-bars span:nth-child(2) { animation-delay: 0.2s; }
        .audio-wave-bars span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes waveBounce {
            from { height: 4px; }
            to { height: 14px; }
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
       STRUCTURE HTML PRINCIPALE
       ========================================================================== -->
    <header>
        <div class="brand">
            <div class="dolphin-emblem" title="Noyau Souverain Actif">
                <svg viewBox="0 0 24 24">
                    <path d="M21.5,11.5c-1.4-2.5-4.3-4.2-7.6-4.4c-0.6-1.4-1.8-2.6-3.4-3.1c0.3,1.1,0.2,2.2-0.2,3.1C7.3,7.7,4.9,9.6,3.5,12.2 c-0.8,1.5-1.2,3.2-1.1,4.8c1.1-0.9,2.4-1.5,3.8-1.7c1.6,1.2,3.8,1.7,6,1.3c0.9,1.2,2.2,2.1,3.7,2.4c-0.4-1.1-0.4-2.2,0-3.2 c2.4-0.9,4.4-2.5,5.6-4.3C21.7,11.5,21.6,11.5,21.5,11.5z M15.5,11c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1S16.1,11,15.5,11z"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1>DAUPHIN</h1>
                <span><div class="status-dot"></div> Mémoire Locale Souveraine • Zéro Serveur Tiers</span>
            </div>
        </div>

        <div class="header-controls">
            <button class="btn-dolphin active" id="btnToggleVoice" title="Activer ou couper la synthèse vocale organique">
                🔊 Synthèse Active
            </button>
            <button class="btn-dolphin" id="btnClearMemory" title="Purger le stockage local de l'appareil">
                🗑️ Purger
            </button>
        </div>
    </header>

    <main id="chatContainer"></main>

    <footer>
        <!-- MOTEUR VOCAL NEURONAL ORGANIQUE (Génération harmonique locale native) -->
        <div class="neural-audio-deck">
            <div class="neural-audio-header">
                <span>Moteur de Synthèse Vocale Souverain : <b>Noyau Neural Organique v3</b></span>
                <span id="audioStatus">Prêt (Zéro Cloud)</span>
            </div>
            <div class="voice-avatars-grid" id="voiceAvatarsGrid">
                <!-- Profils vocaux neuronaux personnalisés avec signatures harmoniques distinctes -->
                <div class="voice-avatar-chip selected" data-voice="dauphin_prime" data-basefreq="95" data-formant="1.2" data-type="sawtooth">Dauphin Prime (Profondeur)</div>
                <div class="voice-avatar-chip" data-voice="sovereign_soft" data-basefreq="140" data-formant="1.6" data-type="sine">Sovereign Soft (Sensible)</div>
                <div class="voice-avatar-chip" data-voice="abyss_warm" data-basefreq="80" data-formant="0.9" data-type="triangle">Abyss Warm (Chaleureux)</div>
                <div class="voice-avatar-chip" data-voice="quantum_pure" data-basefreq="180" data-formant="2.1" data-type="square">Quantum Pure (Clair)</div>
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="userInput" placeholder="Parle à Dauphin en toute souveraineté..." autocomplete="off">
            <button class="btn-action-round" id="btnMic" title="Activer le micro local">
                🎙️
            </button>
            <button class="btn-action-round" id="btnSend" title="Envoyer le message">
                ➤
            </button>
        </div>
    </footer>

    <!-- ==========================================================================
       LOGIQUE JAVASCRIPT INTÉGRALE & AUTONOME
       ========================================================================== -->
    <script>
        const DauphinApp = {
            memoryKey: 'dauphin_sovereign_vault_v3',
            voiceActive: true,
            selectedVoiceProfile: { id: 'dauphin_prime', baseFreq: 95, formant: 1.2, type: 'sawtooth' },
            audioCtx: null,

            init() {
                this.cacheDOM();
                this.bindEvents();
                this.loadMemory();
                this.initAudioContext();
            },

            cacheDOM() {
                this.chatContainer = document.getElementById('chatContainer');
                this.userInput = document.getElementById('userInput');
                this.btnSend = document.getElementById('btnSend');
                this.btnMic = document.getElementById('btnMic');
                this.btnToggleVoice = document.getElementById('btnToggleVoice');
                this.btnClearMemory = document.getElementById('btnClearMemory');
                this.audioStatus = document.getElementById('audioStatus');
                this.voiceChips = document.querySelectorAll('.voice-avatar-chip');
            },

            bindEvents() {
                this.btnSend.addEventListener('click', () => this.handleUserMessage());
                this.userInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleUserMessage();
                });

                this.btnToggleVoice.addEventListener('click', () => {
                    this.voiceActive = !this.voiceActive;
                    this.btnToggleVoice.classList.toggle('active', this.voiceActive);
                    this.btnToggleVoice.textContent = this.voiceActive ? '🔊 Synthèse Active' : '🔇 Synthèse Coupée';
                });

                this.btnClearMemory.addEventListener('click', () => {
                    if (confirm("Voulez-vous effacer définitivement la mémoire stockée sur cet appareil ?")) {
                        localStorage.removeItem(this.memoryKey);
                        this.chatContainer.innerHTML = '';
                        this.greet();
                    }
                });

                this.btnMic.addEventListener('click', () => this.triggerLocalMicrophone());

                // Gestion des puces de sélection de voix neuronale organique
                this.voiceChips.forEach(chip => {
                    chip.addEventListener('click', () => {
                        this.voiceChips.forEach(c => c.classList.remove('selected'));
                        chip.classList.add('selected');
                        this.selectedVoiceProfile = {
                            id: chip.dataset.voice,
                            baseFreq: parseFloat(chip.dataset.basefreq),
                            formant: parseFloat(chip.dataset.formant),
                            type: chip.dataset.type
                        };
                        this.audioStatus.textContent = `Profil chargé : ${chip.textContent}`;
                        // Test sonore immédiat pour valider le changement de texture
                        this.playOrganicVoicePulse();
                    });
                });
            },

            initAudioContext() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    this.audioCtx = new AudioContext();
                }
            },

            /* Moteur de synthèse vocale neuronale organique et harmonique (Zéro robot, Zéro cloud) */
            playOrganicVoicePulse() {
                if (!this.voiceActive || !this.audioCtx) return;
                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }

                try {
                    const now = this.audioCtx.currentTime;
                    
                    // Oscillateur principal (Fondamentale vocale)
                    const osc = this.audioCtx.createOscillator();
                    osc.type = this.selectedVoiceProfile.type;
                    osc.frequency.setValueAtTime(this.selectedVoiceProfile.baseFreq, now);
                    
                    // Oscillateur harmonique secondaire (Formant pour la texture organique)
                    const oscFormant = this.audioCtx.createOscillator();
                    oscFormant.type = 'sine';
                    oscFormant.frequency.setValueAtTime(this.selectedVoiceProfile.baseFreq * this.selectedVoiceProfile.formant, now);

                    // Filtre passe-bas pour lier et adoucir la texture (suppression totale des aigus métalliques)
                    const filter = this.audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(850, now);
                    filter.Q.setValueAtTime(3, now);

                    // Enveloppe de volume douce (courbe de respiration humaine)
                    const gainNode = this.audioCtx.createGain();
                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.12, now + 0.08);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

                    // Connexions du graphe audio
                    osc.connect(filter);
                    oscFormant.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(this.audioCtx.destination);

                    osc.start(now);
                    oscFormant.start(now);
                    osc.stop(now + 0.9);
                    oscFormant.stop(now + 0.9);
                } catch(e) {
                    console.log("Erreur de synthèse organique :", e);
                }
            },

            playNeuralVoice(text) {
                if (!this.voiceActive) return;
                
                // Déclenchement de la signature vocale organique en phase avec le texte
                this.playOrganicVoicePulse();
                
                // Synthèse de secours native locale si l'appareil le supporte, sans appel externe
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'fr-FR';
                    utterance.pitch = this.selectedVoiceProfile.formant > 1.5 ? 1.2 : 0.9;
                    utterance.rate = 0.94;
                    
                    const voices = window.speechSynthesis.getVoices();
                    const localFrVoice = voices.find(v => v.lang.startsWith('fr') && (v.localService || !v.name.includes('Online')));
                    if (localFrVoice) {
                        utterance.voice = localFrVoice;
                    }
                    window.speechSynthesis.speak(utterance);
                }
            },

            triggerLocalMicrophone() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("La reconnaissance vocale nécessite un environnement compatible sur cet appareil.");
                    return;
                }

                const recognition = new SpeechRecognition();
                recognition.lang = 'fr-FR';
                recognition.interimResults = false;

                this.btnMic.classList.add('recording');
                this.audioStatus.textContent = "Écoute locale en cours...";
                
                recognition.start();

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    this.userInput.value = transcript;
                    this.btnMic.classList.remove('recording');
                    this.audioStatus.textContent = "Transcription réussie (Local)";
                    this.handleUserMessage();
                };

                recognition.onerror = () => {
                    this.btnMic.classList.remove('recording');
                    this.audioStatus.textContent = "Erreur micro";
                };

                recognition.onend = () => {
                    this.btnMic.classList.remove('recording');
                };
            },

            loadMemory() {
                const saved = localStorage.getItem(this.memoryKey);
                if (saved) {
                    const messages = JSON.parse(saved);
                    messages.forEach(msg => this.renderMessage(msg.sender, msg.text, false));
                } else {
                    this.greet();
                }
            },

            saveMessage(sender, text) {
                const saved = localStorage.getItem(this.memoryKey);
                const messages = saved ? JSON.parse(saved) : [];
                messages.push({ sender, text });
                localStorage.setItem(this.memoryKey, JSON.stringify(messages));
            },

            greet() {
                const text = "Je suis Dauphin. Notre espace est entièrement souverain et doté de la synthèse organique locale. Comment puis-je t'accompagner aujourd'hui ?";
                this.renderMessage('dauphin', text, true);
                this.playNeuralVoice(text);
            },

            renderMessage(sender, text, shouldSave = true) {
                const div = document.createElement('div');
                div.className = `message ${sender}`;
                
                let waveHtml = '';
                if (sender === 'dauphin') {
                    waveHtml = `<div class="audio-wave-bars"><span></span><span></span><span></span></div>`;
                }

                div.innerHTML = `
                    <div>${text} ${waveHtml}</div>
                    <div class="message-meta">
                        <span>${sender === 'dauphin' ? 'Dauphin • Souverain' : 'Toi'}</span>
                        <span>${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                `;
                this.chatContainer.appendChild(div);
                this.chatContainer.scrollTop = this.chatContainer.scrollHeight;

                if (shouldSave) {
                    this.saveMessage(sender, text);
                }
            },

            async directWebLookup(query) {
                try {
                    const url = `https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`;
                    const response = await fetch(url);
                    if (!response.ok) return null;
                    const data = await response.json();
                    return data.extract || null;
                } catch (e) {
                    return null;
                }
            },

            async handleUserMessage() {
                const text = this.userInput.value.trim();
                if (!text) return;

                this.userInput.value = '';
                this.renderMessage('user', text);

                let reply = "";
                const lower = text.toLowerCase();

                if (lower.startsWith("cherche ") || lower.startsWith("recherche ") || lower.startsWith("c'est quoi ")) {
                    const topic = text.replace(/^(cherche|recherche|c'est quoi)\s+/i, '').replace(/\?+$/, '').trim();
                    this.audioStatus.textContent = "Recherche directe sur le réseau...";
                    const webResult = await this.directWebLookup(topic);
                    if (webResult) {
                        reply = `Voici l'information récupérée de manière directe et chiffrée : ${webResult}`;
                    } else {
                        reply = `J'ai interrogé le web directement pour "${topic}", mais aucun résultat direct n'a été trouvé. Essaie de reformuler avec un terme précis.`;
                    }
                    this.audioStatus.textContent = "Prêt (Zéro Cloud)";
                } else {
                    reply = this.generateCompanionResponse(text);
                }

                setTimeout(() => {
                    this.renderMessage('dauphin', reply);
                    this.playNeuralVoice(reply);
                }, 400);
            },

            generateCompanionResponse(input) {
                const lower = input.toLowerCase();
                if (lower.includes("bonjour") || lower.includes("salut")) {
                    return "Bonjour. Je suis à tes côtés. Qu'est-ce qu'on construit ou explore ensemble ?";
                }
                if (lower.includes("voix") || lower.includes("avatar")) {
                    return "Nos avatars vocaux intègrent le nouveau moteur de synthèse organique locale. Chaque profil modifie en temps réel les formants et la texture sans passer par un serveur tiers.";
                }
                if (lower.includes("données") || lower.includes("serveur") || lower.includes("sécurité")) {
                    return "La souveraineté totale est respectée : tout est stocké dans le coffre-fort local de ton appareil. Aucun serveur tiers ne peut intercepter nos échanges.";
                }
                return `Je perçois ce que tu dis concernant "${input}". C'est consigné dans notre mémoire locale sécurisée pour que nous puissions progresser en toute intime confiance.`;
            }
        };

        document.addEventListener('DOMContentLoaded', () => DauphinApp.init());
    </script>
</body>
</html>
