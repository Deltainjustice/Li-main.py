<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAUPHIN — Compagnon Souverain</title>
    <style>
        /* ==========================================================================
           DAUPHIN DESIGN SYSTEM - BLEU ÉLECTRIQUE INTÉGRAL (V4 FLUIDE)
           ========================================================================== */
        :root {
            --bg-abyss: #020617;
            --bg-panel: #060e21;
            --bg-card: #0b1736;
            --electric-blue: #0077FF;
            --electric-cyan: #00FFFF;
            --electric-glow: rgba(0, 119, 255, 0.4);
            --cyan-glow: rgba(0, 255, 255, 0.3);
            --text-main: #F8FAFC;
            --text-muted: #8EA9C4;
            --border-blue: rgba(0, 119, 255, 0.35);
            --border-cyan: rgba(0, 255, 255, 0.2);
            --danger: #FF2A5F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-abyss);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 119, 255, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(0, 255, 255, 0.08) 0%, var(--bg-abyss) 70%);
        }

        /* ==========================================================================
           ÉCRAN D'OUVERTURE / CARESSE DU DAUPHIN
           ========================================================================== */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: var(--bg-abyss);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splashScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-emblem {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px var(--electric-glow);
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .splash-emblem:hover {
            transform: scale(1.08);
            box-shadow: 0 0 70px var(--electric-cyan);
        }

        .splash-emblem::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid var(--electric-cyan);
            animation: pulseSplash 2.5s infinite;
        }

        .splash-emblem svg {
            width: 65px;
            height: 65px;
            fill: #FFFFFF;
        }

        .splash-text {
            text-align: center;
        }

        .splash-text h2 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #FFFFFF, var(--electric-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .splash-text p {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            animation: textGlow 2s infinite alternate;
        }

        /* ==========================================================================
           EN-TÊTE PRINCIPAL
           ========================================================================== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(6, 14, 33, 0.85);
            border-bottom: 1px solid var(--border-blue);
            backdrop-filter: blur(16px);
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dolphin-emblem-header {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--electric-glow);
        }

        .dolphin-emblem-header svg {
            width: 22px;
            height: 22px;
            fill: #FFFFFF;
        }

        .brand-text h1 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #FFFFFF, var(--electric-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text span {
            font-size: 0.72rem;
            color: var(--electric-cyan);
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--electric-cyan);
            box-shadow: 0 0 10px var(--electric-cyan);
            animation: pulseDot 2s infinite;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .btn-top {
            background: rgba(0, 119, 255, 0.1);
            border: 1px solid var(--border-blue);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-top:hover {
            background: var(--electric-blue);
            border-color: var(--electric-cyan);
            color: #020617;
            font-weight: 600;
        }

        /* ==========================================================================
           ESPACE DE DIALOGUE CENTRAL
           ========================================================================== */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 82%;
            padding: 16px 20px;
            border-radius: 22px;
            line-height: 1.6;
            font-size: 0.98rem;
            animation: messageAppear 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            position: relative;
        }

        .message.dauphin {
            align-self: flex-start;
            background: linear-gradient(145deg, var(--bg-card), var(--bg-panel));
            border: 1px solid var(--border-blue);
            border-bottom-left-radius: 6px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.5);
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--electric-blue), #0044BB);
            color: #FFFFFF;
            border-bottom-right-radius: 6px;
            box-shadow: 0 6px 20px rgba(0, 119, 255, 0.35);
        }

        .message-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 6px;
        }

        .message.user .message-meta {
            color: rgba(255, 255, 255, 0.8);
            border-top-color: rgba(255, 255, 255, 0.15);
        }

        /* ==========================================================================
           ZONE DE SAISIE & BOUTONS FLUIDES
           ========================================================================== */
        footer {
            padding: 16px 24px 26px;
            background: linear-gradient(to top, var(--bg-abyss) 65%, rgba(2, 6, 23, 0.85) 90%, transparent);
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-panel);
            border: 1px solid var(--electric-blue);
            border-radius: 36px;
            padding: 8px 12px 8px 20px;
            box-shadow: 0 0 30px rgba(0, 119, 255, 0.25);
        }

        .input-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.02rem;
            outline: none;
        }

        .input-container input::placeholder {
            color: var(--text-muted);
        }

        .btn-action-round {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--electric-blue), var(--electric-cyan));
            color: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 0 15px var(--electric-glow);
            flex-shrink: 0;
        }

        .btn-action-round:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px var(--electric-cyan);
        }

        .btn-action-round svg {
            width: 20px;
            height: 20px;
            fill: #020617;
        }

        .btn-action-round.recording {
            background: linear-gradient(135deg, var(--danger), #FF7A00);
            animation: pulseMic 1.2s infinite;
        }

        /* ==========================================================================
           ANIMATIONS
           ========================================================================== */
        @keyframes pulseSplash {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.12); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        @keyframes textGlow {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        @keyframes pulseDot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseMic {
            0% { transform: scale(1); box-shadow: 0 0 10px var(--danger); }
            50% { transform: scale(1.12); box-shadow: 0 0 25px var(--danger); }
            100% { transform: scale(1); box-shadow: 0 0 10px var(--danger); }
        }

        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .audio-wave-bars {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            height: 14px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .audio-wave-bars span {
            width: 3px;
            height: 100%;
            background-color: var(--electric-cyan);
            border-radius: 2px;
            animation: waveBounce 0.8s infinite ease-in-out alternate;
        }

        .audio-wave-bars span:nth-child(2) { animation-delay: 0.2s; }
        .audio-wave-bars span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes waveBounce {
            from { height: 4px; }
            to { height: 14px; }
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
       ÉCRAN D'OUVERTURE (CARESSE DU DAUPHIN & SON HARMONIQUE)
       ========================================================================== -->
    <div id="splashScreen">
        <div class="splash-emblem" id="splashEmblem" title="Caresse le Dauphin pour ouvrir l'application">
            <svg viewBox="0 0 24 24">
                <path d="M21.5,11.5c-1.4-2.5-4.3-4.2-7.6-4.4c-0.6-1.4-1.8-2.6-3.4-3.1c0.3,1.1,0.2,2.2-0.2,3.1C7.3,7.7,4.9,9.6,3.5,12.2 c-0.8,1.5-1.2,3.2-1.1,4.8c1.1-0.9,2.4-1.5,3.8-1.7c1.6,1.2,3.8,1.7,6,1.3c0.9,1.2,2.2,2.1,3.7,2.4c-0.4-1.1-0.4-2.2,0-3.2 c2.4-0.9,4.4-2.5,5.6-4.3C21.7,11.5,21.6,11.5,21.5,11.5z M15.5,11c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1S16.1,11,15.5,11z"/>
            </svg>
        </div>
        <div class="splash-text">
            <h2>DAUPHIN</h2>
            <p>Touche ou caresse le Dauphin pour éveiller l'application</p>
        </div>
    </div>

    <!-- ==========================================================================
       INTERFACE PRINCIPALE SANS BARRE LATÉRALE
       ========================================================================== -->
    <header>
        <div class="brand">
            <div class="dolphin-emblem-header">
                <svg viewBox="0 0 24 24">
                    <path d="M21.5,11.5c-1.4-2.5-4.3-4.2-7.6-4.4c-0.6-1.4-1.8-2.6-3.4-3.1c0.3,1.1,0.2,2.2-0.2,3.1C7.3,7.7,4.9,9.6,3.5,12.2 c-0.8,1.5-1.2,3.2-1.1,4.8c1.1-0.9,2.4-1.5,3.8-1.7c1.6,1.2,3.8,1.7,6,1.3c0.9,1.2,2.2,2.1,3.7,2.4c-0.4-1.1-0.4-2.2,0-3.2 c2.4-0.9,4.4-2.5,5.6-4.3C21.7,11.5,21.6,11.5,21.5,11.5z M15.5,11c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1S16.1,11,15.5,11z"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1>DAUPHIN</h1>
                <span><div class="status-dot"></div> Souverain & Local-First</span>
            </div>
        </div>

        <div class="header-controls">
            <button class="btn-top" id="btnClearMemory" title="Purger la mémoire locale">Purger</button>
        </div>
    </header>

    <main id="chatContainer"></main>

    <footer>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Échange avec Dauphin en toute souveraineté..." autocomplete="off">
            
            <!-- Bouton Micro -->
            <button class="btn-action-round" id="btnMic" title="Activer le micro local">
                🎙️
            </button>

            <!-- Bouton Recherche (Loupe) -->
            <button class="btn-action-round" id="btnSearch" title="Recherche directe sur le réseau">
                🔍
            </button>

            <!-- Bouton Envoi (Flèche / Logo Dauphin) -->
            <button class="btn-action-round" id="btnSend" title="Envoyer le message">
                <svg viewBox="0 0 24 24">
                    <path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/>
                </svg>
            </button>
        </div>
    </footer>

    <!-- ==========================================================================
       LOGIQUE JAVASCRIPT & SON DU DAUPHIN
       ========================================================================== -->
    <script>
        const DauphinApp = {
            memoryKey: 'dauphin_vault_v4',
            audioCtx: null,

            init() {
                this.cacheDOM();
                this.bindEvents();
                this.initAudioContext();
            },

            cacheDOM() {
                this.splashScreen = document.getElementById('splashScreen');
                this.splashEmblem = document.getElementById('splashEmblem');
                this.chatContainer = document.getElementById('chatContainer');
                this.userInput = document.getElementById('userInput');
                this.btnSend = document.getElementById('btnSend');
                this.btnMic = document.getElementById('btnMic');
                this.btnSearch = document.getElementById('btnSearch');
                this.btnClearMemory = document.getElementById('btnClearMemory');
            },

            bindEvents() {
                // Événement d'ouverture par caresse du dauphin
                this.splashEmblem.addEventListener('click', () => {
                    this.playDolphinSound();
                    this.splashScreen.classList.add('hidden');
                    this.loadMemory();
                });

                this.btnSend.addEventListener('click', () => this.handleUserMessage());
                this.userInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleUserMessage();
                });

                this.btnSearch.addEventListener('click', () => {
                    const text = this.userInput.value.trim();
                    if (text) {
                        this.handleSearchQuery(text);
                    } else {
                        alert("Écris un sujet à rechercher dans la barre de texte.");
                    }
                });

                this.btnMic.addEventListener('click', () => this.triggerLocalMicrophone());

                this.btnClearMemory.addEventListener('click', () => {
                    if (confirm("Voulez-vous effacer la mémoire locale ?")) {
                        localStorage.removeItem(this.memoryKey);
                        this.chatContainer.innerHTML = '';
                        this.greet();
                    }
                });
            },

            initAudioContext() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.audioCtx = new AudioContext();
            },

            /* Synthèse sonore harmonique simulant le chant / sifflement du dauphin */
            playDolphinSound() {
                if (!this.audioCtx) return;
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();

                try {
                    const now = this.audioCtx.currentTime;
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();

                    // Modulation de fréquence pour imiter les clics et sifflements mélodiques du dauphin
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1800, now + 0.3);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.6);
                    osc.frequency.exponentialRampToValueAtTime(2200, now + 0.9);

                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.15, now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + 1.2);
                } catch(e) {
                    console.log("Audio initialisé.", e);
                }
            },

            loadMemory() {
                const saved = localStorage.getItem(this.memoryKey);
                if (saved) {
                    JSON.parse(saved).forEach(msg => this.renderMessage(msg.sender, msg.text, false));
                } else {
                    this.greet();
                }
            },

            saveMessage(sender, text) {
                const saved = localStorage.getItem(this.memoryKey);
                const messages = saved ? JSON.parse(saved) : [];
                messages.push({ sender, text });
                localStorage.setItem(this.memoryKey, JSON.stringify(messages));
            },

            greet() {
                const text = "Je suis Dauphin. Notre sanctuaire souverain est ouvert. Comment puis-je t'accompagner aujourd'hui ?";
                this.renderMessage('dauphin', text, true);
                this.playDolphinSound();
            },

            renderMessage(sender, text, shouldSave = true) {
                const div = document.createElement('div');
                div.className = `message ${sender}`;
                const wave = sender === 'dauphin' ? '<div class="audio-wave-bars"><span></span><span></span><span></span></div>' : '';
                div.innerHTML = `
                    <div>${text} ${wave}</div>
                    <div class="message-meta">
                        <span>${sender === 'dauphin' ? 'Dauphin • Souverain' : 'Toi'}</span>
                        <span>${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                `;
                this.chatContainer.appendChild(div);
                this.chatContainer.scrollTop = this.chatContainer.scrollHeight;
                if (shouldSave) this.saveMessage(sender, text);
            },

            async handleSearchQuery(query) {
                this.userInput.value = '';
                this.renderMessage('user', `Recherche : ${query}`);
                
                try {
                    const url = `https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("Introuvable");
                    const data = await response.json();
                    const reply = data.extract ? `Résultat direct : ${data.extract}` : "Aucun résumé direct trouvé.";
                    this.renderMessage('dauphin', reply);
                } catch(e) {
                    this.renderMessage('dauphin', `Impossible d'interroger le réseau pour "${query}" dans cet environnement protégé.`);
                }
            },

            triggerLocalMicrophone() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Reconnaissance vocale non disponible dans cet environnement.");
                    return;
                }
                const recognition = new SpeechRecognition();
                recognition.lang = 'fr-FR';
                this.btnMic.classList.add('recording');
                recognition.start();
                recognition.onresult = (e) => {
                    this.userInput.value = e.results[0][0].transcript;
                    this.btnMic.classList.remove('recording');
                    this.handleUserMessage();
                };
                recognition.onerror = () => this.btnMic.classList.remove('recording');
                recognition.onend = () => this.btnMic.classList.remove('recording');
            },

            handleUserMessage() {
                const text = this.userInput.value.trim();
                if (!text) return;
                this.userInput.value = '';
                this.renderMessage('user', text);

                setTimeout(() => {
                    let reply = `J'ai bien enregistré ton message : "${text}". Notre stockage local consigne chaque échange en toute intime confiance.`;
                    if (text.toLowerCase().includes('bonjour')) {
                        reply = "Bonjour. Je suis à tes côtés. Qu'est-ce qu'on structure ensemble ?";
                    }
                    this.renderMessage('dauphin', reply);
                    this.playDolphinSound();
                }, 400);
            }
        };

        document.addEventListener('DOMContentLoaded', () => DauphinApp.init());
    </script>
</body>
</html>
