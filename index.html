
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dauphin - Universal Streaming Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; overflow-x: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center;
            flex-direction: column; transition: opacity 1s ease;
        }
        .dolphin-logo-3d {
            font-size: 5rem; color: #38bdf8; text-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
            animation: zoomInDolphin 2s ease-in-out forwards;
        }
        @keyframes zoomInDolphin {
            0% { transform: scale(0.1) translateZ(-1000px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.2) translateZ(0); opacity: 1; }
        }
        .curtain {
            position: absolute; top: 0; width: 500px; height: 100%; background: linear-gradient(135deg, #0f172a, #020617);
            z-index: 10000; transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .curtain.left { left: 0; transform-origin: left; }
        .curtain.right { right: 0; transform-origin: right; }
        .open-left { transform: translateX(-100%); }
        .open-right { transform: translateX(100%); }

        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #1e1b4b; border-bottom: 2px solid #312e81; }
        h1 { font-size: 1.4rem; color: #38bdf8; letter-spacing: 2px; }
        .controls-top { display: flex; gap: 8px; }
        button { background: #4338ca; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: background 0.2s; }
        button:hover { background: #6366f1; }

        .main-container { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 12px; overflow-y: auto; }
        
        .sources-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 5px; }
        .source-chip { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
        .source-chip.active { background: #38bdf8; color: #0b0f19; font-weight: bold; border-color: #38bdf8; }

        .search-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #4338ca; background: #0f172a; color: white; font-size: 1rem; }
        
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; max-height: 220px; overflow-y: auto; padding: 5px; }
        .track-card { background: #1e293b; padding: 8px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid #334155; }
        .track-card:hover { border-color: #38bdf8; background: #334155; }
        .track-card img { width: 100%; height: 80px; object-fit: cover; border-radius: 6px; margin-bottom: 6px; }

        .equalizer-section { background: #111827; padding: 12px; border-radius: 12px; border: 1px solid #1f2937; }
        .faders-container { display: flex; justify-content: space-around; height: 100px; align-items: flex-end; margin-top: 8px; }
        .fader-wrapper { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .fader { writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 6px; height: 75px; background: #374151; outline: none; border-radius: 3px; cursor: pointer; }

        .player-bar { display: flex; align-items: center; justify-content: space-between; background: #1e1b4b; padding: 12px; border-radius: 12px; }
    </style>
</head>
<body>

    <div id="intro-overlay" onclick="startApp()">
        <div class="dolphin-logo-3d">🐬 DAUPHIN</div>
        <p style="color: #94a3b8; margin-top: 20px; font-size: 0.9rem;">Touchez l'écran pour lancer l'immersion universelle</p>
    </div>

    <div class="curtain left" id="curtainLeft"></div>
    <div class="curtain right" id="curtainRight"></div>

    <header>
        <h1>DAUPHIN PRO</h1>
        <div class="controls-top">
            <button onclick="toggleFullscreen()">Plein Écran</button>
            <button onclick="toggleOfflineMode()">Hors-Ligne</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Sélecteur de plateformes mondiales -->
        <div class="sources-bar" id="sourcesBar">
            <div class="source-chip active" onclick="setSource('all', this)">🌐 Global All</div>
            <div class="source-chip" onclick="setSource('Spotify', this)">🟢 Spotify</div>
            <div class="source-chip" onclick="setSource('Deezer', this)">🟣 Deezer</div>
            <div class="source-chip" onclick="setSource('Napster', this)">⚫ Napster</div>
            <div class="source-chip" onclick="setSource('Tidal', this)">💎 Tidal</div>
            <div class="source-chip" onclick="setSource('Apple Music', this)">🍎 Apple Music</div>
            <div class="source-chip" onclick="setSource('Amazon Music', this)">📦 Amazon Music</div>
            <div class="source-chip" onclick="setSource('YouTube', this)">▶️ YouTube</div>
            <div class="source-chip" onclick="setSource('Yandex Music', this)">🔴 Yandex</div>
            <div class="source-chip" onclick="setSource('GlobaZ', this)">🌍 GlobaZ / Qobuz</div>
            <div class="source-chip" onclick="setSource('Dailymotion', this)">📺 Dailymotion</div>
        </div>

        <input type="text" class="search-box" id="searchInput" placeholder="Rechercher parmi des millions de titres mondiaux..." oninput="filterCatalog()">

        <div class="catalog-grid" id="catalogGrid"></div>

        <div class="equalizer-section">
            <h3 style="font-size: 0.85rem; color: #38bdf8;">Égaliseur Professionnel & Patins Glissants</h3>
            <div class="faders-container">
                <div class="fader-wrapper"><input type="range" class="fader" min="-12" max="12" value="0"><span style="font-size:0.65rem">Sub</span></div>
                <div class="fader-wrapper"><input type="range" class="fader" min="-12" max="12" value="0"><span style="font-size:0.65rem">Bass</span></div>
                <div class="fader-wrapper"><input type="range" class="fader" min="-12" max="12" value="0"><span style="font-size:0.65rem">Mid</span></div>
                <div class="fader-wrapper"><input type="range" class="fader" min="-12" max="12" value="0"><span style="font-size:0.65rem">Treble</span></div>
                <div class="fader-wrapper"><input type="range" class="fader" min="-12" max="12" value="0"><span style="font-size:0.65rem">Air</span></div>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div id="currentTrackInfo" style="font-size: 0.85rem;">Sélectionnez un titre</div>
        <button id="playBtn" onclick="togglePlay()">▶ Lecture</button>
    </div>

    <script>
        const catalog = [
            { title: "Roar", artist: "Katy Perry", source: "Spotify", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150" },
            { title: "Blinding Lights", artist: "The Weeknd", source: "Apple Music", cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=150" },
            { title: "Sonne", artist: "Rammstein", source: "Deezer", cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=150" },
            { title: "Ghost Love Score", artist: "Nightwish", source: "Tidal", cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=150" },
            { title: "Master of Puppets", artist: "Metallica", source: "Napster", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150" },
            { title: "Bad Guy", artist: "Billie Eilish", source: "Amazon Music", cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=150" },
            { title: "Live Concert HD", artist: "Global Artists", source: "YouTube", cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=150" },
            { title: "Moskau Sessions", artist: "Yandex Selection", source: "Yandex Music", cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=150" },
            { title: "Hi-Res Master", artist: "Qobuz/GlobaZ Audio", source: "GlobaZ", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150" },
            { title: "Official Video Clip", artist: "Dailymotion Stream", source: "Dailymotion", cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=150" }
        ];

        let currentSourceFilter = 'all';

        function renderCatalog(items) {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = items.map((t, index) => `
                <div class="track-card" onclick="selectTrack(${index})">
                    <img src="${t.cover}" alt="${t.title}">
                    <div style="font-weight:bold; font-size:0.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${t.title}</div>
                    <div style="color:#94a3b8; font-size:0.7rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${t.artist}</div>
                    <div style="color:#38bdf8; font-size:0.6rem; margin-top:2px;">[${t.source}]</div>
                </div>
            `).join('');
        }

        function setSource(source, element) {
            document.querySelectorAll('.source-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            currentSourceFilter = source;
            filterCatalog();
        }

        function startApp() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1500, ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.8);
            } catch(e) {}

            document.getElementById('curtainLeft').classList.add('open-left');
            document.getElementById('curtainRight').classList.add('open-right');
            setTimeout(() => {
                document.getElementById('intro-overlay').style.display = 'none';
            }, 1500);

            renderCatalog(catalog);
        }

        function filterCatalog() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = catalog.filter(t => {
                const matchesSearch = t.title.toLowerCase().includes(query) || t.artist.toLowerCase().includes(query);
                const matchesSource = currentSourceFilter === 'all' || t.source === currentSourceFilter;
                return matchesSearch && matchesSource;
            });
            renderCatalog(filtered);
        }

        function selectTrack(index) {
            const t = catalog[index];
            document.getElementById('currentTrackInfo').innerText = `${t.title} - ${t.artist} [${t.source}]`;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function toggleOfflineMode() {
            alert("Mode Hors-Ligne activé : Synchronisation locale IndexedDB des flux multiformats.");
        }

        function togglePlay() {
            const btn = document.getElementById('playBtn');
            btn.innerText = btn.innerText.includes('Lecture') ? '⏸ Pause' : '▶ Lecture';
        }

        renderCatalog(catalog);
    </script>
</body>
</html>
